<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="390" viewBox="0 0 1200 390" role="img" aria-labelledby="title desc">
<title id="title">Codex Astralis — Surabhi Bharati</title>
<desc id="desc">A midnight celestial research interface with animated orbital paths, stars, and a softly revealed title.</desc>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#080B18"/><stop offset=".52" stop-color="#11142A"/><stop offset="1" stop-color="#211B3D"/>
  </linearGradient>
  <linearGradient id="line" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#8E83C9" stop-opacity="0"/><stop offset=".5" stop-color="#B9A7FF"/><stop offset="1" stop-color="#8FE5F2" stop-opacity="0"/>
  </linearGradient>
  <radialGradient id="nebula">
    <stop offset="0" stop-color="#7868B8" stop-opacity=".25"/><stop offset="1" stop-color="#7868B8" stop-opacity="0"/>
  </radialGradient>
  <filter id="glow"><feGaussianBlur stdDeviation="4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
</defs>
<rect width="1200" height="390" rx="22" fill="url(#bg)"/>
<ellipse cx="895" cy="190" rx="390" ry="260" fill="url(#nebula)"/>
<!-- fine grid -->
<g stroke="#8D82C7" stroke-opacity=".09" stroke-width="1">
  <path d="M0 78H1200M0 156H1200M0 234H1200M0 312H1200"/>
  <path d="M120 0V390M240 0V390M360 0V390M480 0V390M600 0V390M720 0V390M840 0V390M960 0V390M1080 0V390"/>
</g>
<!-- star field -->
<g fill="#E9E3FF">
  <circle cx="75" cy="55" r="1.5"/><circle cx="176" cy="300" r="1.2"/><circle cx="335" cy="44" r="1.1"/>
  <circle cx="488" cy="320" r="1.4"/><circle cx="620" cy="61" r="1.1"/><circle cx="760" cy="300" r="1.2"/>
  <circle cx="1100" cy="64" r="1.5"/><circle cx="1140" cy="260" r="1.1"/><circle cx="980" cy="345" r="1.3"/>
  <circle cx="560" cy="160" r="1"/><circle cx="270" cy="180" r="1"/><circle cx="1050" cy="170" r="1"/>
</g>
<g fill="#B9A7FF">
  <circle cx="75" cy="55" r="1.5"><animate attributeName="opacity" values=".3;1;.3" dur="3.2s" repeatCount="indefinite"/></circle>
  <circle cx="1100" cy="64" r="1.5"><animate attributeName="opacity" values="1;.25;1" dur="4.1s" repeatCount="indefinite"/></circle>
  <circle cx="488" cy="320" r="1.4"><animate attributeName="opacity" values=".2;1;.2" dur="2.7s" repeatCount="indefinite"/></circle>
</g>
<!-- orbit system -->
<g transform="translate(930 190)" fill="none">
  <ellipse rx="190" ry="65" stroke="#8C80C5" stroke-opacity=".55" stroke-width="1.5" transform="rotate(-25)"/>
  <ellipse rx="155" ry="105" stroke="#8FE5F2" stroke-opacity=".32" stroke-width="1.2" transform="rotate(42)"/>
  <ellipse rx="112" ry="145" stroke="#B9A7FF" stroke-opacity=".22" stroke-width="1" transform="rotate(72)"/>
  <circle r="54" fill="#292653" stroke="#B9A7FF" stroke-opacity=".8" stroke-width="1.5"/>
  <path d="M-43 -4Q0 -27 43 -4M-37 17Q0 1 37 17" stroke="#8175B8" stroke-width="5" opacity=".6"/>
  <circle cx="190" cy="0" r="5" fill="#8FE5F2" stroke="none">
    <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="18s" repeatCount="indefinite"/>
  </circle>
  <circle cx="-155" cy="0" r="4" fill="#C4A96B" stroke="none">
    <animateTransform attributeName="transform" type="rotate" from="0" to="-360" dur="25s" repeatCount="indefinite"/>
  </circle>
</g>
<!-- content -->
<text x="72" y="75" fill="#C4A96B" font-family="monospace" font-size="13" letter-spacing="4">PERSONAL RESEARCH ARCHIVE / 001</text>
<text x="68" y="157" fill="#F0ECFF" font-family="Georgia,serif" font-size="59" letter-spacing="1">
  CODEX ASTRALIS
  <animate attributeName="opacity" values=".65;1;.85;1" dur="6s" repeatCount="indefinite"/>
</text>
<path d="M72 181H690" stroke="url(#line)" stroke-width="2"/>
<text x="74" y="222" fill="#B9A7FF" font-family="monospace" font-size="18" letter-spacing="3">SURABHI BHARATI</text>
<text x="74" y="260" fill="#D7D2EA" font-family="Georgia,serif" font-size="21" font-style="italic">Somewhere between logic and infinity.</text>
<text x="74" y="319" fill="#8FE5F2" font-family="monospace" font-size="12" letter-spacing="2">AI / ML  ·  SOFTWARE ENGINEERING  ·  CREATIVE COMPUTING</text>
<text x="1125" y="365" text-anchor="end" fill="#8B85A9" font-family="monospace" font-size="10" letter-spacing="2">COGITO · CONSTRUO · EXPLORO</text>
</svg>