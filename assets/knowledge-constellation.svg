
<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="650" viewBox="0 0 1000 650" role="img" aria-labelledby="t d">
  <title id="t">Surabhi's Knowledge Constellation</title>
  <desc id="d">A balanced constellation connecting AI, engineering, computational languages, algorithms, and data systems.</desc>

  <defs>
    <linearGradient id="c" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#B9A7FF"/>
      <stop offset="1" stop-color="#8FE5F2"/>
    </linearGradient>
    <filter id="g" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="3" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="1000" height="650" rx="18" fill="#0B0E1B"/>

  <!-- Connection lines -->
  <g stroke="#7770A5" stroke-opacity=".42" stroke-width="1.6" fill="none">
    <path d="M500 315L235 165M500 315L765 165M500 315L235 475M500 315L765 475M500 315L500 90"/>
    <path d="M235 165L120 85M235 165L365 75M765 165L640 75M765 165L880 85"/>
    <path d="M235 475L105 570M235 475L375 570M765 475L625 570M765 475L895 570"/>
  </g>

  <!-- Main heading -->
  <text x="500" y="35" text-anchor="middle"
        font-family="monospace" font-size="13"
        letter-spacing="3" fill="#C4A96B">
    THE KNOWLEDGE CONSTELLATION
  </text>

  <!-- Category headings -->
  <g font-family="monospace" text-anchor="middle" fill="#D9D2F3">
    <text x="235" y="125" font-size="17">AI / ML</text>
    <text x="765" y="125" font-size="17">ENGINEERING</text>
    <text x="235" y="430" font-size="17">ALGORITHMS</text>
    <text x="765" y="430" font-size="17">DATA SYSTEMS</text>
    <text x="500" y="125" font-size="16">COMPUTATIONAL LANGUAGES</text>
  </g>

  <!-- Category descriptions -->
  <g font-family="monospace" text-anchor="middle"
     font-size="10" fill="#A9A3C4">
    <text x="235" y="145">NLP · LLMs · RAG</text>
    <text x="765" y="145">REACT · FASTAPI</text>
    <text x="235" y="450">DSA · DP · GRAPHS</text>
    <text x="765" y="450">SQL · NoSQL · CLOUD</text>
    <text x="500" y="148">PYTHON · JAVA · C · JAVASCRIPT</text>
  </g>

  <!-- Outer labels -->
  <g font-family="monospace" text-anchor="middle"
     font-size="11" fill="#D9D2F3">
    <text x="120" y="62">MACHINE LEARNING</text>
    <text x="365" y="53">DEEP LEARNING</text>
    <text x="640" y="53">FULL STACK</text>
    <text x="880" y="62">API DESIGN</text>

    <text x="105" y="603">OPTIMIZATION</text>
    <text x="375" y="603">BACKTRACKING</text>
    <text x="625" y="603">DATABASES</text>
    <text x="895" y="603">INFRASTRUCTURE</text>
  </g>

  <!-- Central identity circle -->
  <circle cx="500" cy="315" r="48"
          fill="#29234A" stroke="#B9A7FF"
          stroke-width="2" filter="url(#g)"/>

  <text x="500" y="310" text-anchor="middle"
        font-family="monospace" font-size="17"
        font-weight="bold" fill="#F0EAFB">
    SURABHI
  </text>

  <text x="500" y="335" text-anchor="middle"
        font-family="monospace" font-size="10"
        letter-spacing="1" fill="#C8B9FF">
    ENGINEER / EXPLORER
  </text>

  <!-- Main category nodes -->
  <g fill="#B9A7FF" filter="url(#g)">
    <circle cx="235" cy="165" r="7"/>
    <circle cx="765" cy="165" r="7"/>
    <circle cx="235" cy="475" r="7"/>
    <circle cx="765" cy="475" r="7"/>
    <circle cx="500" cy="90" r="7"/>
  </g>

  <!-- Outer nodes -->
  <g fill="#8FE5F2">
    <circle cx="120" cy="85" r="4"/>
    <circle cx="365" cy="75" r="4"/>
    <circle cx="640" cy="75" r="4"/>
    <circle cx="880" cy="85" r="4"/>
    <circle cx="105" cy="570" r="4"/>
    <circle cx="375" cy="570" r="4"/>
    <circle cx="625" cy="570" r="4"/>
    <circle cx="895" cy="570" r="4"/>
  </g>
</svg>
